<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Primary Icon Vibrant Cyan/Indigo Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Book Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gold Accent Ribbon -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Specular highlight reflection -->
  <rect x="6" y="6" width="116" height="56" rx="26" fill="white" opacity="0.04" />

  <!-- Legal Codex / Book Icon with Glow -->
  <g filter="url(#iconShadow)">
    <!-- Book Cover Silhouette -->
    <rect x="30" y="24" width="68" height="80" rx="8" fill="url(#pageGrad)" stroke="url(#primaryGrad)" stroke-width="5" />

    <!-- Spine Line -->
    <line x1="42" y1="24" x2="42" y2="104" stroke="url(#primaryGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Decorative spine rivets/dots -->
    <circle cx="36" cy="36" r="2.5" fill="#38bdf8" />
    <circle cx="36" cy="64" r="2.5" fill="#60a5fa" />
    <circle cx="36" cy="92" r="2.5" fill="#818cf8" />

    <!-- Legal Article Lines (Paragraphs/Classification structure) -->
    <line x1="52" y1="42" x2="84" y2="42" stroke="#f1f5f9" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />
    <line x1="52" y1="56" x2="84" y2="56" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
    <line x1="52" y1="70" x2="74" y2="70" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" opacity="0.75" />

    <!-- Judicial Ribbon Bookmark (Gold / Yellow - Ukrainian law & justice motif) -->
    <path d="M72 24 V44 L79 38 L86 44 V24 Z" fill="url(#goldGrad)" />

    <!-- System pulse node indicator at bottom right of page -->
    <circle cx="82" cy="86" r="4.5" fill="#38bdf8" />
  </g>
</svg>
